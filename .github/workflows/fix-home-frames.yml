name: Fix home frames

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch HTML
        run: python3 scripts/fix_home_frames.py
      - name: Commit
        run: |
          git config user.name ELOCollective
          git config user.email tech@elocollective.com
          git add index.html what-we-do/index.html company/index.html contact/index.html
          git diff --cached --stat
          git commit -m "Point pages at new nav CSS and kill home hairlines inline" || echo no changes
          git push
