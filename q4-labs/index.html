 Serif';letter-spacing:-.05em;margin:0}.quote p{font:400 clamp(31px,3.5vw,54px)/1.02 'Instrument Serif';max-width:780px;margin:0}.mosaic-band{display:grid;grid-template-columns:1.2fr .8fr;min-height:560px}.mosaic-band img{width:100%;height:100%;object-fit:cover;display:block}.mosaic-copy{background:var(--paper2);padding:70px;display:flex;flex-direction:column;justify-content:center}.mosaic-copy h3{font:400 clamp(54px,6vw,90px)/.88 'Instrument Serif';letter-spacing:-.05em;margin:20px 0 28px}.mosaic-copy p{max-width:470px;line-height:1.8;color:#4f4d45}.company-hero{padding:125px 0 100px;border-bottom:1px solid var(--line)}.company-hero h1{font:400 clamp(80px,11vw,170px)/.78 'Instrument Serif';letter-spacing:-.07em;margin:25px 0 45px;max-width:1100px}.company-hero p{font-size:18px;line-height:1.8;max-width:680px;color:#4f4d45}.leadership{padding:120px 0}.lead-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.leader{background:var(--paper);min-height:330px;padding:32px;display:flex;flex-direction:column;justify-content:flex-end}.leader .role{font:10px 'DM Mono';letter-spacing:.14em;text-transform:uppercase;color:#756e63}.leader h3{font:400 55px 'Instrument Serif';margin:12px 0 8px}.leader p{max-width:420px;line-height:1.7;color:#5b574f}.principles{background:var(--olive);color:var(--paper);padding:130px 0}.principles-grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid rgba(238,229,212,.22)}.principle{padding:38px 30px 55px 0;border-bottom:1px solid rgba(238,229,212,.22)}.principle:nth-child(odd){padding-right:70px}.principle:nth-child(even){padding-left:70px;border-left:1px solid rgba(238,229,212,.22)}.principle h3{font:400 54px/.9 'Instrument Serif';margin:20px 0}.principle p{color:rgba(238,229,212,.72);line-height:1.75;max-width:480px}.story{padding:140px 0}.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}.story img{width:100%;height:620px;object-fit:cover;filter:saturate(.78)}.story-copy h2{font:400 clamp(58px,6.5vw,100px)/.86 'Instrument Serif';letter-spacing:-.05em;margin:0 0 30px}.story-copy p{font-size:16px;line-height:1.8;color:#4f4d45;max-width:570px}.contact{background:var(--ink);color:var(--paper);padding:130px 0}.contact h2{font:400 clamp(75px,10vw,150px)/.78 'Instrument Serif';letter-spacing:-.065em;margin:20px 0 45px;max-width:1000px}.contact p{color:rgba(238,229,212,.7);max-width:520px;line-height:1.75}.contact a{display:inline-block;margin-top:35px;border:1px solid rgba(238,229,212,.45);padding:13px 18px;font:10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase}.footer{border-top:1px solid var(--line);padding:22px 0;display:flex;justify-content:space-between;font:9px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:#756e63}@media(max-width:900px){.nav-links{gap:14px;font-size:9px}.page-hero,.story-grid,.mosaic-band{grid-template-columns:1fr}.page-hero-media{min-height:55vh}.page-hero-copy{padding:80px 0}.section-head,.quote-grid{grid-template-columns:1fr;gap:35px}.cap-grid,.systems-grid,.lead-grid,.principles-grid{grid-template-columns:1fr}.principle:nth-child(even){padding-left:0;border-left:0}.principle:nth-child(odd){padding-right:0}.story img{height:420px}.footer{flex-direction:column;gap:8px}}@media(max-width:650px){.container{width:min(100% - 34px,1440px)}.nav-links{display:none}.logo{font-size:36px}.page-hero h1,.company-hero h1{font-size:72px}.cap h3,.system-card h3,.leader h3{font-size:48px}.mosaic-copy{padding:45px 25px}.system-card{min-height:350px}}
<a class="logo" href="../">QUARTIERE <span>Q4</span></a><div class="nav-links"><a href="../what-we-do/">What We Do</a><a href="../q4-labs/" class="is-active">Q4 Labs</a><a href="../company/">Company</a><a href="../contact/">Contact</a></div></nav><section class="page-hero"><div class="container page-hero-copy"><span class="kicker">01 / Q4 Labs</span><h1>Machines for human work.</h1><p>We build proprietary systems for specific kinds of work, then apply them as part of the intervention. They are not the destination. They are the machinery that extends what people can do.</p></div><div class="page-hero-media"><img src="../assets/q4-labs-hero.png" alt="Radio telescope against a blue sky and mountains"></div></section><section class="section"><div class="container"><div class="section-head"><div><span class="kicker">02 / The systems</span></div><div><h2>Four systems. Four kinds of intelligence.</h2><p>Each system is built around a specific kind of work. Together they extend what people can see, understand, decide and do.</p></div></div><div class="labs-grid"><article class="lab"><span class="num">01 / LUMEN</span><span class="type">B2C / Audience intelligence</span><h2>Understand your audience.</h2><p>Turn fragmented audience behaviour into a living picture of what people want, feel and do.</p><div class="detail"><strong>What it does</strong>Lumen brings fragmented audience behaviour together so it can be understood as a living picture rather than isolated signals.</div></article><article class="lab"><span class="num">02 / POLYSOMA</span><span class="type">Decision intelligence</span><h2>Simulate the decision.</h2><p>Explore complex business decisions, test scenarios and understand how systems may respond before acting.</p><div class="detail"><strong>What it does</strong>Polysoma is used to model choices and test scenarios before committing resources in the real world, making complex decisions more legible.</div></article><article class="lab"><span class="num">03 / ALTIERA</span><span class="type">Organisational intelligence</span><h2>Give the organisation a memory.</h2><p>Connect knowledge, context and information so people can find, understand and use what the organisation already knows.</p><div class="detail"><strong>What it does</strong>Altiera connects organisational knowledge, context and information so the people doing the work can use what the organisation already knows.</div></article><article class="lab"><span class="num">04 / MERCURIA</span><span class="type">Commercial intelligence</span><h2>Make commercial intelligence usable.</h2><p>Bring customer, market, operational and commercial information together so teams can understand what is happening and act.</p><div class="detail"><strong>What it does</strong>Mercuria brings customer, market, operational and commercial information together, giving teams a more usable view of what is happening and where to act.</div></article></div></div></section><section class="dark-band"><div class="container"><div class="section-head"><div><span class="kicker">03 / Human capability</span></div><div><p class="statement">The tools change. The work remains human.</p></div></div></div></section>
